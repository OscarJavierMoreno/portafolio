

<!-- CONTACTO -->
<section class="contact">

    <div class="contact__layout">

        <!-- TITULO -->
        <h2 class="contact__title">
            <i class="fa-regular fa-envelope"></i>
            CONTACTO
        </h2>

        <!-- DESCRIPCION -->
        <p class="contact__description">
            ¿Tienes una idea, proyecto o simplemente quieres hablar sobre desarrollo,
            videojuegos o tecnología? 🚀
            Estoy disponible para colaborar y construir experiencias increíbles.
        </p>

        <!-- FORMULARIO -->
        <form class="contact__form">

            <!-- NOMBRE -->
            <div class="contact__input-container">
                <label class="contact__label">
                    <i class="fa-regular fa-user"></i>
                    Nombre
                </label>

                <input 
                    type="text"
                    class="contact__input"
                    placeholder="Tu nombre..."
                >
            </div>

            <!-- EMAIL -->
            <div class="contact__input-container">
                <label class="contact__label">
                    <i class="fa-regular fa-envelope"></i>
                    Correo
                </label>

                <input 
                    type="email"
                    class="contact__input"
                    placeholder="correo@gmail.com"
                >
            </div>

            <!-- MENSAJE -->
            <div class="contact__input-container">
                <label class="contact__label">
                    <i class="fa-regular fa-comment"></i>
                    Mensaje
                </label>

                <textarea 
                    class="contact__textarea"
                    placeholder="Escribe tu mensaje..."
                ></textarea>
            </div>

            <!-- BOTON -->
            <button class="contact__button">
                <i class="fa-solid fa-paper-plane"></i>
                ENVIAR MENSAJE
            </button>

        </form>

    </div>

</section>
