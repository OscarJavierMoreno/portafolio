
<!-- CONTACTO -->
<section class="scroll-margin contact" id="contact-section">

    <div class="contact__layout">

        <!-- TITULO -->
        <h2 class="contact__title">
            <i class="fa-regular fa-envelope"></i>
            CONTACTO
        </h2>

        <!-- DESCRIPCION -->
        <p class="contact__description">
            ¿Tienes una idea, proyecto o simplemente quieres hablar sobre desarrollo,
            videojuegos o tecnología? 🚀
            Estoy disponible para colaborar y construir experiencias increíbles.
        </p>

        <!-- FORMULARIO -->
        <form class="contact__form" id="contactForm">

            <!-- NOMBRE -->
            <div class="contact__input-container">

                <label class="contact__label" for="name">
                    <i class="fa-regular fa-user"></i>
                    Nombre
                </label>

                <input 
                    type="text"
                    class="contact__input"
                    id="name"
                    placeholder="Tu nombre..."
                >

                <!-- ERROR -->
                <small 
                    class="contact__error"
                    id="name-error"
                ></small>

            </div>

            <!-- EMAIL -->
            <div class="contact__input-container">

                <label class="contact__label" for="email">
                    <i class="fa-regular fa-envelope"></i>
                    Correo
                </label>

                <input 
                    type="email"
                    class="contact__input"
                    id="email"
                    placeholder="correo@gmail.com"
                >

                <!-- ERROR -->
                <small 
                    class="contact__error"
                    id="email-error"
                ></small>

            </div>

            <!-- MENSAJE -->
            <div class="contact__input-container">

                <label class="contact__label" for="message">
                    <i class="fa-regular fa-comment"></i>
                    Mensaje
                </label>

                <textarea 
                    class="contact__textarea"
                    id="message"
                    placeholder="Escribe tu mensaje..."
                ></textarea>

                <!-- ERROR -->
                <small 
                    class="contact__error"
                    id="message-error"
                ></small>

            </div>

            <!-- BOTON -->
            <button class="contact__button" type="submit">

                <i class="fa-solid fa-paper-plane"></i>
                ENVIAR MENSAJE

            </button>

        </form>

    </div>

</section>
